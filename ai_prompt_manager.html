<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniPrompt Studio - AI Prompt Manager</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    code, textarea.font-mono, pre {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom Scrollbar for Soft Themes */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .dark ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-track {
      background: rgba(241, 245, 249, 0.8);
    }
    .dark ::-webkit-scrollbar-thumb {
      background: rgba(51, 65, 85, 0.8);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(203, 213, 225, 0.9);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 1);
    }
  </style>
</head>
<body class="h-full overflow-hidden bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-200">
  <div id="root" class="h-full"></div>

  <script type="text/babel">

    // Default Seed Data
    const INITIAL_TOOLS = [

    const INITIAL_CATEGORIES = [

    const INITIAL_PROMPTS = [
      {

    const Icon = ({ name, className = "w-5 h-5" }) => {
      const icons = {
        sun: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />,

        search: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />,

        star: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />,
        starSolid: <path fill="currentColor" d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.363 1.118l1.07 3.292c.3.921-.755 1.688-1.538 1.118l-2.8-2.034a1 1 0 00-1.176 0l-2.8 2.034c-.783.57-1.838-.197-1.538-1.118l1.07-3.292a1 1 0 00-.363-1.118l-2.8-2.034c-.784-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />,
        copy: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />,
        edit: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />,
        trash: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />,
        tag: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />,
        sheets: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />,
        download: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />,
        upload: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />,
        capture: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />,
        external: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />,
        play: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />,
        sparkles: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />,
        variable: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />,
        grid: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />,
        list: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />,
        close: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />,
        check: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" />,
        refresh: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />,
        filter: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
      };

      return (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
          {icons[name] || null}
        </svg>
      );
    };

    function App() {
      // Theme State (Day Soft Mode vs Night Soft Dark)
      const [theme, setTheme] = useState(() => {
        const saved = localStorage.getItem('omniprompt_theme');
        return saved ? saved : 'dark';
      });

      // Search & Ref
      const searchInputRef = useRef(null);

      // Persistence State
      const [prompts, setPrompts] = useState(() => {
        const saved = localStorage.getItem('omniprompt_prompts');
        return saved ? JSON.parse(saved) : INITIAL_PROMPTS;
      });

      const [categories, setCategories] = useState(() => {
        const saved = localStorage.getItem('omniprompt_categories');
        return saved ? JSON.parse(saved) : INITIAL_CATEGORIES;
      });

      const [tools, setTools] = useState(() => {
        const saved = localStorage.getItem('omniprompt_tools');
        return saved ? JSON.parse(saved) : INITIAL_TOOLS;
      });

      const [sheetsConfig, setSheetsConfig] = useState(() => {
        const saved = localStorage.getItem('omniprompt_sheets_config');
        return saved ? JSON.parse(saved) : { scriptUrl: '', csvPromptsUrl: '', lastSynced: null };
      });

      // Filter & Layout State
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [selectedTool, setSelectedTool] = useState('all');
      const [selectedTag, setSelectedTag] = useState('');
      const [favoritesOnly, setFavoritesOnly] = useState(false);
      const [viewMode, setViewMode] = useState('grid');
      const [sortBy, setSortBy] = useState('recent');

      // Modal Control State
      const [modalState, setModalState] = useState({ type: null, data: null });
      const [toast, setToast] = useState(null);

      // Selected Text / Selection Listener State
      const [hasSelectedText, setHasSelectedText] = useState(false);
      const [currentSelectionText, setCurrentSelectionText] = useState('');

      // Theme toggle handler & sync
      useEffect(() => {
        localStorage.setItem('omniprompt_theme', theme);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [theme]);

      const toggleTheme = () => {
        setTheme(prev => prev === 'dark' ? 'light' : 'dark');
      };

      // Keyboard Shortcut listener for Search (Cmd/Ctrl + K or /)
      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            searchInputRef.current?.focus();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      // Auto Sync to LocalStorage
      useEffect(() => {
        localStorage.setItem('omniprompt_prompts', JSON.stringify(prompts));
      }, [prompts]);

      useEffect(() => {
        localStorage.setItem('omniprompt_categories', JSON.stringify(categories));
      }, [categories]);

      useEffect(() => {
        localStorage.setItem('omniprompt_tools', JSON.stringify(tools));
      }, [tools]);

      useEffect(() => {
        localStorage.setItem('omniprompt_sheets_config', JSON.stringify(sheetsConfig));
      }, [sheetsConfig]);

      // Global Selected Text Capture Listener
      useEffect(() => {
        const handleSelectionChange = () => {
          const selection = window.getSelection().toString().trim();
          if (selection && selection.length > 5) {
            setHasSelectedText(true);
            setCurrentSelectionText(selection);
          } else {
            setHasSelectedText(false);
          }
        };
        document.addEventListener('selectionchange', handleSelectionChange);
        return () => document.removeEventListener('selectionchange', handleSelectionChange);
      }, []);

      // Toast Notification Trigger
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      // Extract all unique tags across prompts
      const allTags = useMemo(() => {
        const tagSet = new Set();
        prompts.forEach(p => p.tags?.forEach(t => tagSet.add(t)));
        return Array.from(tagSet).sort();
      }, [prompts]);

      // Multi-Field Enhanced Search & Filter Logic
      const filteredPrompts = useMemo(() => {
        return prompts
          .filter(p => {
            if (favoritesOnly && !p.favorite) return false;
            if (selectedCategory !== 'all' && p.category !== selectedCategory) return false;
            if (selectedTool !== 'all' && !p.tools?.includes(selectedTool)) return false;
            if (selectedTag && !p.tags?.includes(selectedTag)) return false;
            if (searchQuery.trim()) {
              const query = searchQuery.toLowerCase().trim();
              const catObj = categories.find(c => c.id === p.category);
              
              const matchTitle = p.title.toLowerCase().includes(query);
              const matchDesc = p.description?.toLowerCase().includes(query);
              const matchContent = p.content.toLowerCase().includes(query);
              const matchTags = p.tags?.some(t => t.toLowerCase().includes(query));
              const matchCat = catObj?.name.toLowerCase().includes(query);
              const matchTools = p.tools?.some(tId => {
                const toolObj = tools.find(t => t.id === tId);
                return toolObj?.name.toLowerCase().includes(query);
              });

              return matchTitle || matchDesc || matchContent || matchTags || matchCat || matchTools;
            }
            return true;
          })
          .sort((a, b) => {
            if (sortBy === 'usage') return (b.usageCount || 0) - (a.usageCount || 0);
            if (sortBy === 'title') return a.title.localeCompare(b.title);
            return new Date(b.createdAt) - new Date(a.createdAt);
          });
      }, [prompts, favoritesOnly, selectedCategory, selectedTool, selectedTag, searchQuery, sortBy, categories, tools]);

      // Prompt Actions
      const handleToggleFavorite = (id) => {
        setPrompts(prev => prev.map(p => p.id === id ? { ...p, favorite: !p.favorite } : p));
      };

      const handleDeletePrompt = (id) => {
        if (confirm('Are you sure you want to delete this prompt?')) {
          setPrompts(prev => prev.filter(p => p.id !== id));
          showToast('Prompt deleted', 'info');
        }
      };

      const handleSavePrompt = (promptData) => {
        if (promptData.id) {
          setPrompts(prev => prev.map(p => p.id === promptData.id ? { ...promptData, updatedAt: new Date().toISOString() } : p));
          showToast('Prompt updated successfully!');
        } else {
          const newPrompt = {
            ...promptData,
            id: 'p-' + Date.now(),
            favorite: false,
            usageCount: 0,
            createdAt: new Date().toISOString()
          };
          setPrompts(prev => [newPrompt, ...prev]);
          showToast('New prompt added!');
        }
        setModalState({ type: null, data: null });
      };

      const handleIncrementUsage = (id) => {
        setPrompts(prev => prev.map(p => p.id === id ? { ...p, usageCount: (p.usageCount || 0) + 1 } : p));
      };

      const copyToClipboard = (text, promptId = null) => {
        try {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
          showToast('Copied to clipboard!');
          if (promptId) handleIncrementUsage(promptId);
        } catch (err) {
          showToast('Failed to copy text', 'error');
        }
      };

      const extractVariables = (text) => {
        const regex = /\{([a-zA-Z0-9_]+)\}/g;
        const matches = [];
        let match;
        while ((match = regex.exec(text)) !== null) {
          if (!matches.includes(match[1])) {
            matches.push(match[1]);
          }
        }
        return matches;
      };

      const handleExecuteOrCopy = (prompt) => {
        const vars = extractVariables(prompt.content);
        if (vars.length > 0) {
          setModalState({ type: 'variableFill', data: { prompt, vars } });
        } else {
          copyToClipboard(prompt.content, prompt.id);
        }
      };

      return (
        <div className="flex h-screen flex-col overflow-hidden bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-200">
          
          {/* Top Header Bar */}
          <header className="flex h-16 shrink-0 items-center justify-between border-b border-slate-200 dark:border-slate-800/80 bg-white/80 dark:bg-slate-900/80 px-4 backdrop-blur md:px-6">
            <div className="flex items-center space-x-3">
              <div className="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 shadow-md shadow-indigo-500/20">
                <Icon name="sparkles" className="w-5 h-5 text-white" />
              </div>
              <div className="hidden sm:block">
                <h1 className="text-base font-bold tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
                  OmniPrompt <span className="rounded bg-indigo-500/10 px-2 py-0.5 text-xs font-semibold text-indigo-600 dark:text-indigo-400 border border-indigo-500/20">Studio</span>
                </h1>
                <p className="text-[11px] text-slate-500 dark:text-slate-400">Cross-AI Prompt Database & Manager</p>
              </div>

            <div className="relative mx-3 flex-1 max-w-md">

              <input
                ref={searchInputRef}
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}

                className="w-full rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-100/70 dark:bg-slate-950 pl-9 pr-14 py-2 text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:border-indigo-500 focus:bg-white dark:focus:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition"
              />
              {searchQuery ? (
                <button onClick={() => setSearchQuery('')} className="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 dark:hover:text-white">
                  <Icon name="close" className="w-4 h-4" />
                </button>
              ) : (
                <kbd className="hidden md:inline-flex absolute right-3 top-2 items-center rounded border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-1.5 py-0.5 text-[10px] font-medium text-slate-400">
                  ⌘K
                </kbd>
              )}
            </div>

            {/* Actions & Theme Toggle */}
            <div className="flex items-center space-x-2">
              {/* Day / Night Soft Theme Toggle Button */}
              <button

                className="flex h-9 w-9 items-center justify-center rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-100/80 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition"
                title={`Switch to ${theme === 'dark' ? 'Day (Light)' : 'Night (Dark)'} Theme`}
              >
                <Icon name={theme === 'dark' ? 'sun' : 'moon'} className="w-4 h-4" />
              </button>

              {/* Quick Save Selected Text Floating Badge */}
              {hasSelectedText && (
                <button
                  onClick={() => setModalState({ type: 'editPrompt', data: { content: currentSelectionText, title: 'Captured Snippet' } })}
                  className="animate-bounce flex items-center space-x-1.5 rounded-lg bg-indigo-600 px-3 py-1.5 text-xs font-medium text-white shadow-md hover:bg-indigo-500 transition"
                >
                  <Icon name="capture" className="w-4 h-4" />
                  <span className="hidden lg:inline">Save Selected Text</span>
                </button>
              )}

              <button
                onClick={() => setModalState({ type: 'sheets' })}
                className="flex items-center space-x-1.5 rounded-xl border border-emerald-500/30 bg-emerald-500/10 px-3 py-2 text-xs font-medium text-emerald-600 dark:text-emerald-400 hover:bg-emerald-500/20 transition"
                title="Google Sheets Sync"
              >
                <Icon name="sheets" className="w-4 h-4" />
                <span className="hidden lg:inline">Sheets Sync</span>
              </button>

              <button
                onClick={() => setModalState({ type: 'importExport' })}
                className="hidden sm:flex items-center space-x-1.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-800/80 px-3 py-2 text-xs font-medium text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition"
              >
                <Icon name="download" className="w-4 h-4" />
                <span className="hidden xl:inline">Import/Export</span>
              </button>

              <button
                onClick={() => setModalState({ type: 'editPrompt', data: null })}
                className="flex items-center space-x-1.5 rounded-xl bg-indigo-600 px-3.5 py-2 text-xs font-semibold text-white shadow-md hover:bg-indigo-500 transition active:scale-95"
              >
                <Icon name="plus" className="w-4 h-4" />
                <span>New</span>
              </button>
            </div>
          </header>

          {/* Main Layout Container */}
          <div className="flex flex-1 overflow-hidden">

            {/* Sidebar Navigation */}
            <aside className="w-60 shrink-0 border-r border-slate-200/80 dark:border-slate-800/80 bg-white/50 dark:bg-slate-900/40 p-4 overflow-y-auto hidden md:block">
              <div className="space-y-6">
                
                {/* Quick Starred Prompts Toggle */}
                <button
                  onClick={() => setFavoritesOnly(!favoritesOnly)}
                  className={`flex w-full items-center justify-between rounded-xl px-3 py-2 text-xs font-medium transition ${
                    favoritesOnly
                      ? 'bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/30'
                      : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/50 hover:text-slate-900 dark:hover:text-slate-200'
                  }`}
                >
                  <div className="flex items-center space-x-2">
                    <Icon name={favoritesOnly ? 'starSolid' : 'star'} className={`w-4 h-4 ${favoritesOnly ? 'text-amber-500' : ''}`} />
                    <span>Starred Prompts</span>
                  </div>
                  <span className="rounded-full bg-slate-200/80 dark:bg-slate-800 px-2 py-0.5 text-[10px] text-slate-600 dark:text-slate-400">
                    {prompts.filter(p => p.favorite).length}
                  </span>
                </button>

                {/* AI Tools Filter */}
                <div>
                  <h3 className="mb-2 text-[10px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 px-1">Target AI Tools</h3>
                  <div className="space-y-1">
                    <button
                      onClick={() => setSelectedTool('all')}
                      className={`flex w-full items-center justify-between rounded-lg px-2.5 py-1.5 text-xs font-medium transition ${
                        selectedTool === 'all'
                          ? 'bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 border border-indigo-500/30 font-semibold'
                          : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/40 hover:text-slate-900 dark:hover:text-slate-200'
                      }`}
                    >
                      <span>All Platforms</span>
                      <span className="text-[10px] text-slate-400">{prompts.length}</span>
                    </button>

                    {tools.map(tool => {
                      const count = prompts.filter(p => p.tools?.includes(tool.id)).length;
                      return (
                        <button
                          key={tool.id}
                          onClick={() => setSelectedTool(selectedTool === tool.id ? 'all' : tool.id)}
                          className={`flex w-full items-center justify-between rounded-lg px-2.5 py-1.5 text-xs font-medium transition ${
                            selectedTool === tool.id ? `${tool.color} border` : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/40'
                          }`}
                        >
                          <span className="truncate">{tool.name}</span>
                          <span className="text-[10px] text-slate-400">{count}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Categories Filter */}
                <div>
                  <h3 className="mb-2 text-[10px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 px-1">Categories</h3>
                  <div className="space-y-1">
                    <button
                      onClick={() => setSelectedCategory('all')}
                      className={`flex w-full items-center justify-between rounded-lg px-2.5 py-1.5 text-xs font-medium transition ${
                        selectedCategory === 'all'
                          ? 'bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 border border-indigo-500/30 font-semibold'
                          : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/40 hover:text-slate-900 dark:hover:text-slate-200'
                      }`}
                    >
                      <span>All Categories</span>
                    </button>

                    {categories.map(cat => (
                      <button
                        key={cat.id}
                        onClick={() => setSelectedCategory(selectedCategory === cat.id ? 'all' : cat.id)}
                        className={`flex w-full items-center justify-between rounded-lg px-2.5 py-1.5 text-xs font-medium transition ${
                          selectedCategory === cat.id ? 'bg-slate-200 dark:bg-slate-800 text-slate-900 dark:text-slate-100 border border-slate-300 dark:border-slate-700' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/40'
                        }`}
                      >
                        <span className="flex items-center space-x-2 truncate">
                          <span>{cat.icon}</span>
                          <span>{cat.name}</span>
                        </span>
                        <span className="text-[10px] text-slate-400">
                          {prompts.filter(p => p.category === cat.id).length}
                        </span>
                      </button>
                    ))}
                  </div>
                </div>

                {/* Tags Cloud */}
                {allTags.length > 0 && (
                  <div>
                    <h3 className="mb-2 text-[10px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 px-1">Tags</h3>
                    <div className="flex flex-wrap gap-1.5">
                      {allTags.map(tag => (
                        <button
                          key={tag}
                          onClick={() => setSelectedTag(selectedTag === tag ? '' : tag)}
                          className={`rounded-md px-2 py-0.5 text-[11px] font-medium transition ${
                            selectedTag === tag
                              ? 'bg-indigo-600 text-white shadow-sm'
                              : 'bg-slate-200/80 dark:bg-slate-800/80 text-slate-600 dark:text-slate-400 hover:bg-slate-300 dark:hover:bg-slate-700 hover:text-slate-900 dark:hover:text-slate-200'
                          }`}
                        >
                          #{tag}
                        </button>
                      ))}
                    </div>
                  </div>
                )}

              </div>
            </aside>

            {/* Main Prompt Cards View */}
            <main className="flex-1 overflow-y-auto bg-slate-50 dark:bg-slate-950 p-4 md:p-6">
              
              {/* Active Filter Badges & Sort Bar */}
              <div className="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                
                <div className="flex flex-wrap items-center gap-2">
                  <h2 className="text-sm font-bold text-slate-900 dark:text-white">Prompt Library</h2>
                  <span className="rounded-full bg-slate-200 dark:bg-slate-800 px-2.5 py-0.5 text-xs font-medium text-slate-600 dark:text-slate-400 border border-slate-300 dark:border-slate-700">
                    {filteredPrompts.length} prompts
                  </span>

                  {searchQuery && (
                    <span className="inline-flex items-center gap-1 rounded-md bg-indigo-50 dark:bg-indigo-500/10 px-2 py-0.5 text-xs font-medium text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-500/30">
                      Search: "{searchQuery}"
                      <button onClick={() => setSearchQuery('')} className="hover:opacity-75"><Icon name="close" className="w-3 h-3" /></button>
                    </span>
                  )}

                  {selectedCategory !== 'all' && (
                    <span className="inline-flex items-center gap-1 rounded-md bg-blue-50 dark:bg-blue-500/10 px-2 py-0.5 text-xs font-medium text-blue-600 dark:text-blue-400 border border-blue-200 dark:border-blue-500/30">
                      Cat: {categories.find(c => c.id === selectedCategory)?.name}
                      <button onClick={() => setSelectedCategory('all')} className="hover:opacity-75"><Icon name="close" className="w-3 h-3" /></button>
                    </span>
                  )}

                  {selectedTool !== 'all' && (
                    <span className="inline-flex items-center gap-1 rounded-md bg-emerald-50 dark:bg-emerald-500/10 px-2 py-0.5 text-xs font-medium text-emerald-600 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-500/30">
                      Tool: {tools.find(t => t.id === selectedTool)?.name}
                      <button onClick={() => setSelectedTool('all')} className="hover:opacity-75"><Icon name="close" className="w-3 h-3" /></button>
                    </span>
                  )}

                  {selectedTag && (
                    <span className="inline-flex items-center gap-1 rounded-md bg-purple-50 dark:bg-purple-500/10 px-2 py-0.5 text-xs font-medium text-purple-600 dark:text-purple-400 border border-purple-200 dark:border-purple-500/30">
                      #{selectedTag}
                      <button onClick={() => setSelectedTag('')} className="hover:opacity-75"><Icon name="close" className="w-3 h-3" /></button>
                    </span>
                  )}
                </div>

                {/* View Switcher & Sorting */}
                <div className="flex items-center space-x-2">
                  <select
                    value={sortBy}
                    onChange={(e) => setSortBy(e.target.value)}
                    className="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-3 py-1.5 text-xs font-medium text-slate-700 dark:text-slate-300 focus:border-indigo-500 focus:outline-none"
                  >
                    <option value="recent">Sort by Most Recent</option>
                    <option value="usage">Sort by Most Used</option>
                    <option value="title">Sort Alphabetically</option>
                  </select>

                  <div className="flex rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-0.5">
                    <button
                      onClick={() => setViewMode('grid')}
                      className={`rounded-lg p-1.5 transition ${viewMode === 'grid' ? 'bg-slate-100 dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 shadow-xs' : 'text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'}`}
                      title="Grid View"
                    >
                      <Icon name="grid" className="w-4 h-4" />
                    </button>
                    <button
                      onClick={() => setViewMode('list')}
                      className={`rounded-lg p-1.5 transition ${viewMode === 'list' ? 'bg-slate-100 dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 shadow-xs' : 'text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'}`}
                      title="List View"
                    >
                      <Icon name="list" className="w-4 h-4" />
                    </button>
                  </div>
                </div>
              </div>

              {/* Empty State */}
              {filteredPrompts.length === 0 && (
                <div className="flex flex-col items-center justify-center rounded-2xl border border-dashed border-slate-300 dark:border-slate-800 p-12 text-center my-8 bg-white/50 dark:bg-slate-900/30">
                  <div className="flex h-14 w-14 items-center justify-center rounded-2xl bg-indigo-50 dark:bg-slate-900 border border-indigo-100 dark:border-slate-800 text-indigo-500 mb-4">
                    <Icon name="search" className="w-6 h-6" />
                  </div>
                  <h3 className="text-sm font-semibold text-slate-800 dark:text-slate-200">No prompts found</h3>
                  <p className="mt-1 text-xs text-slate-500 dark:text-slate-400 max-w-sm">
                    {searchQuery || selectedCategory !== 'all' || selectedTool !== 'all' || selectedTag
                      ? 'No items matched your current search or filters.'
                      : 'Get started by creating your first prompt or syncing with Google Sheets.'}
                  </p>
                  <button
                    onClick={() => {
                      setSearchQuery('');
                      setSelectedCategory('all');
                      setSelectedTool('all');
                      setSelectedTag('');
                      setFavoritesOnly(false);
                    }}
                    className="mt-4 rounded-xl bg-slate-200 dark:bg-slate-800 px-4 py-2 text-xs font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-300 dark:hover:bg-slate-700 transition"
                  >
                    Reset Search & Filters
                  </button>
                </div>
              )}

              {/* Prompt Grid / List Layout */}
              <div className={viewMode === 'grid' ? 'grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3' : 'space-y-3'}>
                {filteredPrompts.map(prompt => {
                  const cat = categories.find(c => c.id === prompt.category);
                  const promptVars = extractVariables(prompt.content);

                  return (
                    <div
                      key={prompt.id}
                      className="group relative flex flex-col justify-between rounded-2xl border border-slate-200/80 dark:border-slate-800/80 bg-white dark:bg-slate-900/60 p-5 backdrop-blur transition hover:border-indigo-400/60 dark:hover:border-indigo-500/50 hover:shadow-md"
                    >
                      {/* Top Bar on Card */}
                      <div>
                        <div className="flex items-start justify-between gap-2 mb-2">
                          <div className="flex items-center space-x-2">
                            {cat && (
                              <span className="inline-flex items-center text-xs font-medium text-slate-600 dark:text-slate-400 bg-slate-100 dark:bg-slate-800/80 rounded-md px-2 py-0.5">
                                <span className="mr-1">{cat.icon}</span>
                                {cat.name}
                              </span>
                            )}
                            {promptVars.length > 0 && (
                              <span className="inline-flex items-center text-[10px] font-semibold text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-500/10 border border-indigo-200 dark:border-indigo-500/20 rounded-md px-1.5 py-0.5">
                                <Icon name="variable" className="w-3 h-3 mr-1" />
                                {promptVars.length} {promptVars.length === 1 ? 'var' : 'vars'}
                              </span>
                            )}
                          </div>

                          <button
                            onClick={() => handleToggleFavorite(prompt.id)}
                            className={`p-1 transition rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 ${
                              prompt.favorite ? 'text-amber-500' : 'text-slate-400 dark:text-slate-600 hover:text-slate-600 dark:hover:text-slate-400'
                            }`}
                          >
                            <Icon name={prompt.favorite ? 'starSolid' : 'star'} className="w-4 h-4" />
                          </button>
                        </div>

                        {/* Prompt Title & Description */}
                        <h3 className="text-sm font-semibold text-slate-900 dark:text-white group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition line-clamp-1">
                          {prompt.title}
                        </h3>
                        {prompt.description && (
                          <p className="mt-1 text-xs text-slate-500 dark:text-slate-400 line-clamp-2">
                            {prompt.description}
                          </p>
                        )}

                        {/* Prompt Content Preview Box */}
                        <div className="mt-3 rounded-xl border border-slate-200/80 dark:border-slate-800/60 bg-slate-50 dark:bg-slate-950/80 p-3 font-mono text-[11px] text-slate-700 dark:text-slate-300 line-clamp-3">
                          {prompt.content}
                        </div>

                        {/* Tool Badges */}
                        <div className="mt-3 flex flex-wrap gap-1">
                          {prompt.tools?.map(tId => {
                            const t = tools.find(tool => tool.id === tId);
                            if (!t) return null;
                            return (
                              <span key={tId} className={`rounded px-1.5 py-0.5 text-[10px] font-medium border ${t.color}`}>
                                {t.name}
                              </span>
                            );
                          })}
                        </div>

                        {/* Tags */}
                        {prompt.tags && prompt.tags.length > 0 && (
                          <div className="mt-2 flex flex-wrap gap-1">
                            {prompt.tags.map(tag => (
                              <span key={tag} className="text-[10px] text-slate-400 dark:text-slate-500 hover:text-indigo-500 transition">
                                #{tag}
                              </span>
                            ))}
                          </div>
                        )}
                      </div>

                      {/* Card Bottom Footer / Action Bar */}
                      <div className="mt-4 flex items-center justify-between border-t border-slate-100 dark:border-slate-800/60 pt-3">
                        <span className="text-[10px] text-slate-400 dark:text-slate-500">
                          Used {prompt.usageCount || 0} times
                        </span>

                        <div className="flex items-center space-x-1">
                          {/* Launch Links */}
                          {prompt.tools && prompt.tools.length > 0 && (
                            <div className="flex items-center space-x-1 mr-2 border-r border-slate-200 dark:border-slate-800 pr-2">
                              {prompt.tools.slice(0, 2).map(tId => {
                                const tool = tools.find(t => t.id === tId);
                                if (!tool) return null;
                                return (
                                  <a
                                    key={tId}
                                    href={tool.url}
                                    target="_blank"
                                    rel="noreferrer"
                                    className="p-1 text-slate-400 hover:text-slate-700 dark:hover:text-white transition rounded hover:bg-slate-100 dark:hover:bg-slate-800"
                                    title={`Open in ${tool.name}`}
                                  >
                                    <Icon name="external" className="w-3.5 h-3.5" />
                                  </a>
                                );
                              })}
                            </div>
                          )}

                          <button
                            onClick={() => setModalState({ type: 'editPrompt', data: prompt })}
                            className="p-1.5 text-slate-400 hover:text-slate-700 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition"
                            title="Edit Prompt"
                          >
                            <Icon name="edit" className="w-3.5 h-3.5" />
                          </button>

                          <button
                            onClick={() => handleDeletePrompt(prompt.id)}
                            className="p-1.5 text-slate-400 hover:text-rose-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition"
                            title="Delete Prompt"
                          >
                            <Icon name="trash" className="w-3.5 h-3.5" />
                          </button>

                          <button
                            onClick={() => handleExecuteOrCopy(prompt)}
                            className="flex items-center space-x-1 rounded-lg bg-indigo-50 dark:bg-indigo-600/20 px-2.5 py-1.5 text-xs font-semibold text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-500/30 hover:bg-indigo-600 hover:text-white transition shadow-xs active:scale-95"
                          >
                            <Icon name={promptVars.length > 0 ? "variable" : "copy"} className="w-3.5 h-3.5" />
                            <span>{promptVars.length > 0 ? 'Fill' : 'Copy'}</span>
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

            </main>
          </div>

          {/* Toast Notification Popup */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 flex items-center space-x-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-4 py-3 text-sm font-medium text-slate-800 dark:text-white shadow-2xl animate-fade-in">
              <Icon name="check" className="w-5 h-5 text-emerald-500" />
              <span>{toast.message}</span>
            </div>
          )}

          {/* Modal 1: Create or Edit Prompt */}
          {modalState.type === 'editPrompt' && (
            <PromptEditorModal
              prompt={modalState.data}
              categories={categories}
              tools={tools}
              onClose={() => setModalState({ type: null, data: null })}
              onSave={handleSavePrompt}
              showToast={showToast}
            />
          )}

          {/* Modal 2: Variable Substitution & Copy Modal */}
          {modalState.type === 'variableFill' && (
            <VariableFillerModal
              prompt={modalState.data.prompt}
              vars={modalState.data.vars}
              tools={tools}
              onClose={() => setModalState({ type: null, data: null })}
              onCopy={(filledText) => copyToClipboard(filledText, modalState.data.prompt.id)}
            />
          )}

          {/* Modal 3: Google Sheets Sync Setup Modal */}
          {modalState.type === 'sheets' && (
            <GoogleSheetsModal
              config={sheetsConfig}
              onSaveConfig={(cfg) => {
                setSheetsConfig(cfg);
                showToast('Sheets configuration saved!');
              }}
              prompts={prompts}
              categories={categories}
              tools={tools}
              onImportSheetsData={(newPrompts) => {
                setPrompts(newPrompts);
                showToast(`Synced ${newPrompts.length} prompts from Google Sheets!`);
              }}
              onClose={() => setModalState({ type: null, data: null })}
            />
          )}

          {/* Modal 4: JSON Import / Export Modal */}
          {modalState.type === 'importExport' && (
            <ImportExportModal
              prompts={prompts}
              categories={categories}
              tools={tools}
              onImport={(data) => {
                if (data.prompts) setPrompts(data.prompts);
                if (data.categories) setCategories(data.categories);
                if (data.tools) setTools(data.tools);
                showToast('Library imported successfully!');
                setModalState({ type: null, data: null });
              }}
              onClose={() => setModalState({ type: null, data: null })}
            />
          )}

        </div>

    function GoogleSheetsModal({ config, onSaveConfig, prompts, categories, tools, onImportSheetsData, onClose }) {
      const [scriptUrl, setScriptUrl] = useState(config.scriptUrl || '');
      const [csvPromptsUrl, setCsvPromptsUrl] = useState(config.csvPromptsUrl || '');
      const [isSyncing, setIsSyncing] = useState(false);
      const [activeTab, setActiveTab] = useState('connect');

      const sampleAppsScript = `// --- Google Apps Script API for OmniPrompt Studio ---
function doGet() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName("Prompts") || ss.getSheets()[0];
  var data = sheet.getDataRange().getValues();
  var prompts = [];
  
  for (var i = 1; i < data.length; i++) {
    var row = data[i];
    if (!row[0]) continue;
    prompts.push({
      id: String(row[0]),
      title: String(row[1] || ''),
      description: String(row[2] || ''),
      category: String(row[3] || 'coding'),
      tools: row[4] ? String(row[4]).split(',').map(s=>s.trim()) : [],
      tags: row[5] ? String(row[5]).split(',').map(s=>s.trim()) : [],
      content: String(row[6] || ''),
      createdAt: new Date().toISOString()
    });
  }
  
  return ContentService.createTextOutput(JSON.stringify(prompts))
    .setMimeType(ContentService.MimeType.JSON);
}`;

      const handleSave = () => {
        onSaveConfig({ scriptUrl, csvPromptsUrl, lastSynced: new Date().toISOString() });
      };

      const handleFetchFromSheets = async () => {
        if (!scriptUrl && !csvPromptsUrl) {
          alert('Please enter a Web App Script URL or Published CSV URL first!');
          return;
        }

        setIsSyncing(true);
        try {
          if (scriptUrl) {
            const res = await fetch(scriptUrl);
            const data = await res.json();
            if (Array.isArray(data)) {
              onImportSheetsData(data);
            } else if (data.prompts) {
              onImportSheetsData(data.prompts);
            }
          } else if (csvPromptsUrl) {
            const res = await fetch(csvPromptsUrl);
            const csvText = await res.text();
            const lines = csvText.split('\n');
            const parsed = [];
            for (let i = 1; i < lines.length; i++) {
              const cols = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
              if (cols.length >= 2) {
                parsed.push({
                  id: 'gs-' + i,
                  title: cols[0]?.replace(/^"|"$/g, '') || 'Untitled Prompt',
                  description: cols[1]?.replace(/^"|"$/g, '') || '',
                  category: cols[2]?.replace(/^"|"$/g, '') || 'coding',
                  tools: cols[3] ? cols[3].replace(/^"|"$/g, '').split(';') : ['chatgpt'],
                  tags: cols[4] ? cols[4].replace(/^"|"$/g, '').split(';') : [],
                  content: cols[5]?.replace(/^"|"$/g, '') || cols[1] || '',
                  createdAt: new Date().toISOString()
                });
              }
            }
            if (parsed.length > 0) {
              onImportSheetsData(parsed);
            }
          }
        } catch (err) {
          console.error(err);
          alert('Failed to sync from Google Sheets. Ensure CORS sharing and permissions are configured.');
        } finally {
          setIsSyncing(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 dark:bg-black/70 p-4 backdrop-blur-sm overflow-y-auto">
          <div className="relative w-full max-w-2xl rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-6 shadow-2xl my-8 text-slate-800 dark:text-slate-100">

                <Icon name="sheets" className="w-5 h-5 text-emerald-500" />
                <span>Google Sheets Database Connector</span>
              </h2>

                <Icon name="close" className="w-5 h-5" />
              </button>

            <div className="flex space-x-2 border-b border-slate-200 dark:border-slate-800 mb-4 pb-2">
              <button
                onClick={() => setActiveTab('connect')}
                className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition ${activeTab === 'connect' ? 'bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30' : 'text-slate-500 dark:text-slate-400'}`}
              >
                1. Sync Settings
              </button>
              <button
                onClick={() => setActiveTab('script')}
                className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition ${activeTab === 'script' ? 'bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30' : 'text-slate-500 dark:text-slate-400'}`}

            {activeTab === 'connect' ? (

                  <input
                    type="text"

                    onChange={(e) => setScriptUrl(e.target.value)}
                    placeholder="https://script.google.com/macros/s/.../exec"
                    className="w-full rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 px-3.5 py-2 text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-600 focus:border-emerald-500 focus:outline-none"

                  <button

                  >

                    <span>{isSyncing ? 'Syncing...' : 'Sync Now'}</span>

            ) : (

    function ImportExportModal({ prompts, categories, tools, onImport, onClose }) {
      const [importText, setImportText] = useState('');

      const handleExportJSON = () => {
        const fullBackup = {
          version: '1.0',
          exportedAt: new Date().toISOString(),
          prompts,
          categories,
          tools
        };

        const blob = new Blob([JSON.stringify(fullBackup, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `omniprompt-backup-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            onImport(parsed);
          } catch (err) {
            alert('Invalid JSON file format.');
          }
        };
        reader.readAsText(file);
      };

      const handlePasteImport = () => {
        try {
          const parsed = JSON.parse(importText);
          onImport(parsed);
        } catch (err) {
          alert('Invalid JSON string format.');
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 dark:bg-black/70 p-4 backdrop-blur-sm overflow-y-auto">

              </button>
            </div>

            <div className="space-y-6">
              <div>
                <h3 className="text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Export Library</h3>
                <p className="text-xs text-slate-500 dark:text-slate-400 mb-3">Download your complete database as a structured JSON file.</p>
                <button
                  onClick={handleExportJSON}
                  className="flex items-center space-x-2 rounded-xl bg-slate-100 dark:bg-slate-800 px-4 py-2.5 text-xs font-semibold text-slate-800 dark:text-white hover:bg-slate-200 dark:hover:bg-slate-700 transition border border-slate-200 dark:border-slate-700 w-full justify-center"
                >
                  <Icon name="download" className="w-4 h-4 text-indigo-500" />
                  <span>Download Backup (.JSON)</span>
                </button>
              </div>

              <div className="border-t border-slate-200 dark:border-slate-800 pt-4">
                <h3 className="text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Import Library</h3>
                <p className="text-xs text-slate-500 dark:text-slate-400 mb-3">Upload or paste JSON data to merge or overwrite your current prompts.</p>
                
                <input
                  type="file"
                  accept=".json"
                  onChange={handleFileUpload}
                  className="block w-full text-xs text-slate-500 dark:text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer mb-3"
                />

                <textarea
                  rows="4"
                  value={importText}
                  onChange={(e) => setImportText(e.target.value)}
                  placeholder="Or paste JSON array / database here..."
                  className="w-full rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 p-3 font-mono text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-600 focus:border-indigo-500 focus:outline-none mb-3"
                />

                <button
                  onClick={handlePasteImport}
                  className="w-full rounded-xl bg-indigo-600 py-2 text-xs font-semibold text-white hover:bg-indigo-500 transition"
                >
                  Apply JSON Import
                </button>
              </div>
            </div>

            <div className="mt-6 flex justify-end border-t border-slate-200 dark:border-slate-800 pt-4">
              <button
                type="button"
                onClick={onClose}
                className="rounded-xl border border-slate-200 dark:border-slate-800 px-4 py-2 text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
